[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aegis-healer"
version = "0.1.0"
description = "Aegis | API Healer: detect API schema drift and repair it with rules first, a LangGraph agent second."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Stuart Paul" }]
keywords = ["schema drift", "data engineering", "pydantic", "langgraph", "data quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13",
    "python-dotenv>=1.0,<2",
    "langgraph>=0.2,<2",
    "langchain-anthropic>=0.3,<2",
    "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build", "twine"]

[project.scripts]
aegis = "aegis_healer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_healer"]

[tool.hatch.build.targets.sdist]
exclude = ["legacy", ".aegis", ".env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
