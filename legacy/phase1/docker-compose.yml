services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline_admin} -d ${POSTGRES_DB:-pipeline}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  mock_api:
    build:
      context: ./mock_api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MOCK_API_PORT:-8100}:8000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
