[project]
name = "aegis-api-protector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
mock-api = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]
agent = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.2,<1",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
run-pipeline = "pipeline.ingestor:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]